<!DOCTYPE html>
<!--
  neoconvert v1.0.2 — 2026-09-29
  Offline single-file audio converter. No libraries. No network access.
  All processing is on the device.

  Input  (own decoders): WAV / RF64, AIFF / AIFC, AU / SND, CAF (PCM, A-law, µ-law), FLAC
  Input  (browser):      MP3, AAC / ALAC (M4A, MP4, ADTS), Ogg Vorbis / Opus / FLAC, WebM
  Output: MP3  — own MPEG-1 Layer III encoder, CBR 128-320 kbps: psychoacoustic model, noise shaping with
                 scalefactors, short blocks on attacks, M/S or L/R per frame, bit reservoir, Xing/LAME-format Info frame.
                 Filterbank and model run on the GPU (WebGPU) when there is a hardware GPU; else on the CPU.
          AAC  — browser WebCodecs encoder (AAC-LC 128-256 kbps) in an own M4A writer (moov first, iTunes tags)
          Opus — browser WebCodecs encoder (96-192 kbps, 48 kHz) in an own Ogg writer (pre-skip, end trim)
          FLAC — own encoder: fixed + LPC predictors, Rice partitions, 4 stereo modes, CRC-8/16, MD5
          WAV (16, 24, 32 float), AIFF (16, 24), AU (8-bit µ-law)
          AAC and Opus are shown only when this browser has the encoder (checked at startup).
  Tags: title, artist, album, album artist, date, track, disc, genre, composer, comment and cover art
        are read from ID3v1/v2, Vorbis comments, FLAC pictures, MP4 ilst, RIFF INFO, AIFF and CAF chunks,
        and written as ID3v2.3 (MP3, WAV, AIFF), Vorbis comments (FLAC, Opus), ilst (M4A), RIFF INFO (WAV).
  DSP:  windowed-sinc resampler (Kaiser), TPDF dither when bit depth decreases
  Memory: WAV, AIFF, AU, CAF and FLAC input streams from the file in the worker (slices, not the whole file).
        Other input is decoded whole by the browser. Above about 600 MB (estimate) the app asks first.
  Data: MP3 Huffman tables and analysis window are from ISO 11172-3 (values via the Shine encoder,
        cross-checked with lamejs)
  Known limits: AAC output has no edit list, so the encoder priming samples stay at the start (not gapless).
        MP3 speed is about 25x real time on a desktop CPU core (slower than the v0.4 encoder, for quality).
        Damaged FLAC: a false frame that passes CRC-8 far ahead of the real position can shift later audio.
  Debug (console): neoconvert.gpu = 'auto' | 'off' | 'force'; neoconvert.version, .worker, .support, .info
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; worker-src blob:; style-src 'unsafe-inline'; img-src data: blob:; media-src blob:">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>neoconvert</title>
<style>
:root{
  --bg:#000;--fg:#fff;--dim:rgba(255,255,255,.55);--faint:rgba(255,255,255,.2);--acc:#ccff00;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{
  font:15px/1.4 var(--mono);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;overscroll-behavior:none;
}
#grid{position:fixed;inset:0;width:100%;height:100%;display:block}
#stage{position:fixed;inset:0;height:100vh;height:100dvh}

/* + button */
#add{
  position:absolute;left:50%;top:50%;width:72px;height:72px;border-radius:50%;border:0;
  background:var(--acc);color:#000;display:grid;place-items:center;cursor:pointer;outline:none;
  transform:translate(-50%,-50%);
  transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s;
}
#add svg{width:28px;height:28px;display:block}
#add:active{transform:translate(-50%,-50%) scale(.94);transition-duration:80ms}
#add:focus-visible{box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--fg)}
/* lifted: button and panel are one group, centred in the screen (layout() sets the variables) */
body.lifted #add{transform:translate(-50%,calc(-50% + var(--btn-dy,-132px))) scale(.67)}
body.lifted #add:active{transform:translate(-50%,calc(-50% + var(--btn-dy,-132px))) scale(.62)}
body.busy #add{opacity:.25;pointer-events:none}

/* center panel */
#panel{
  position:absolute;left:50%;top:var(--panel-top,calc(50% - 84px));transform:translateX(-50%);
  width:min(340px,calc(100vw - 32px));
  max-height:var(--panel-max,calc(50% + 84px - 16px - env(safe-area-inset-bottom)));
  overflow-y:auto;text-align:center;animation:rise .25s ease-out;
}
#safe{position:absolute;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.name{font-size:13px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--dim);margin-top:2px}
.label{font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin:20px 0 4px}
.sub{font-size:10.5px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.sub.keep{text-transform:none;font-size:12px;letter-spacing:.04em}
.list{display:flex;flex-direction:column}
button{font:inherit;-webkit-appearance:none;appearance:none}
.opt{
  display:block;width:100%;height:48px;background:none;border:0;color:var(--fg);
  text-transform:uppercase;letter-spacing:.1em;cursor:pointer;outline:none;
}
.opt.sel{color:var(--acc)}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:2px}
.chip{
  height:44px;min-width:44px;padding:0 9px;border:0;background:none;color:var(--dim);font-size:13px;
  letter-spacing:.02em;cursor:pointer;outline:none;
}
.chip.sel{color:var(--fg);box-shadow:inset 0 -2px 0 var(--acc)}
.go{
  display:block;margin:14px auto 6px;height:48px;padding:0 32px;border:0;border-radius:24px;
  background:var(--acc);color:#000;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;outline:none;
}
.opt:focus-visible,.chip:focus-visible,.link:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.go:focus-visible{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}
.bar{position:relative;height:2px;background:var(--faint);width:min(280px,70vw);margin:32px auto 12px;overflow:hidden}
.bar i{position:absolute;inset:0;background:var(--acc);transform-origin:0 50%;transform:scaleX(0)}
.pct{font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--dim);min-height:17px;margin-top:4px}
.link{
  height:48px;padding:0 12px;border:0;background:none;color:var(--dim);font-size:13px;
  text-transform:uppercase;letter-spacing:.1em;cursor:pointer;outline:none;
}

/* status line under the button in idle state */
#status{
  position:absolute;left:50%;top:calc(50% + 56px);transform:translateX(-50%);
  width:min(340px,calc(100vw - 48px));text-align:center;font-size:13px;color:var(--dim);
}
#status .msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status .msg.ok{color:var(--fg)}
#status .actions{display:flex;justify-content:center;align-items:center;gap:8px}
#status .hint{font-size:11px;margin-top:2px}
.go.save{margin:8px 0 0;height:44px;padding:0 26px}
.warn{font-size:13px;color:var(--fg);margin:12px 8px 0;text-transform:none;user-select:text;-webkit-user-select:text}

#file{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
noscript{position:fixed;left:0;right:0;bottom:24px;text-align:center;color:var(--dim);font-size:13px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="grid" aria-hidden="true"></canvas>
<main id="stage">
  <button id="add" type="button" aria-label="Select an audio file">
    <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 4v20M4 14h20" stroke="#000" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>
  </button>
  <section id="panel" hidden></section>
  <div id="status" hidden role="status" aria-live="polite"></div>
  <div id="safe" aria-hidden="true"></div>
  <input id="file" type="file" tabindex="-1" aria-hidden="true"
         accept="audio/*,.wav,.wave,.aif,.aiff,.aifc,.au,.snd,.caf,.flac,.mp3,.m4a,.m4b,.aac,.mp4,.ogg,.oga,.opus,.webm,.weba">
</main>
<noscript>neoconvert needs JavaScript.</noscript>

<script type="text/plain" id="core-src">
'use strict';

  function err(code) { const e = new Error(code); e.code = code; return e; }

  // IEEE 754 80-bit extended (AIFF sample rate)
  function readExt80(dv, o) {
    const se = dv.getUint16(o), hi = dv.getUint32(o + 2), lo = dv.getUint32(o + 6);

    const hiF = m * 2147483648, hi = Math.floor(hiF), lo = Math.round((hiF - hi) * 4294967296);

  function reader(kind, le) {

        : (dv, o) => (((dv.getUint8(o + 2) | (dv.getUint8(o + 1) << 8) | (dv.getUint8(o) << 16)) << 8) >> 8) / 8388608;
      case 'i4': return (dv, o) => dv.getInt32(o, le) / 2147483648;
      case 'f4': return (dv, o) => dv.getFloat32(o, le);
      case 'f8': return (dv, o) => dv.getFloat64(o, le);

    const c = comm.comp;

  }

  // Place the lifted button and the panel as one group in the middle of the screen. The panel scrolls
  // only when the group is taller than the screen; then the button goes to the top edge.
  const stage = $('#stage'), safeEl = $('#safe');
  const BTN = 48, GAP = 20, EDGE = 16;               // lifted button size (72 x 0.67), gap, screen margin
  function layout() {
    if (panel.hidden) return;
    const cs = getComputedStyle(safeEl), sTop = parseFloat(cs.paddingTop) || 0, sBot = parseFloat(cs.paddingBottom) || 0;
    const H = stage.clientHeight;
    panel.style.maxHeight = 'none';
    const content = panel.scrollHeight;
    panel.style.maxHeight = '';
    const avail = H - sTop - sBot - 2 * EDGE;
    const top = sTop + EDGE + Math.max(0, (avail - (BTN + GAP + content)) / 2);
    const panelTop = top + BTN + GAP;
    body.style.setProperty('--btn-dy', Math.round(top + BTN / 2 - H / 2) + 'px');
    body.style.setProperty('--panel-top', Math.round(panelTop) + 'px');
    body.style.setProperty('--panel-max', Math.max(96, Math.floor(H - panelTop - sBot - EDGE)) + 'px');
  }
  addEventListener('resize', layout);
  if (window.visualViewport) visualViewport.addEventListener('resize', layout);

  function render() {
    try { renderPanel(); } finally { layout(); }
  }
  function renderPanel() {
    body.classList.toggle('lifted', state !== S.IDLE);
    body.classList.toggle('busy', state === S.CONVERTING);
    addBtn.setAttribute('aria-label', state === S.IDLE ? 'Select an audio file' : 'Select a different audio file');
    barEl = barFill = pctEl = noteEl = null;
    panel.replaceChildren();
    if (state === S.IDLE) { panel.hidden = true; return; }
    panel.hidden = false;
    panel.append(h('p', { class: 'name', title: job.file.name }, job.file.name));
    if (job.info) panel.append(h('p', { class: 'meta' }, describe(job.info)));

    if (state === S.CONVERTING) {
      barFill = h('i');
      barEl = h('div', { class: 'bar', role: 'progressbar', 'aria-label': 'Conversion progress',
                         'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': '0' }, barFill);
      pctEl = h('p', { class: 'pct' }, '0%');
      noteEl = h('p', { class: 'note' });
      panel.append(barEl, pctEl, noteEl, h('button', { class: 'link', type: 'button', onclick: back }, 'Cancel'));
      paintProgress();
      return;
    }

    if (state === S.WARN) {
      panel.append(
        h('p', { class: 'label' }, job.format.label),
        h('p', { class: 'warn' }, `This conversion needs about ${mb(job.need)} of memory. On a phone the browser can close the page.`),
        h('button', { class: 'go', type: 'button', onclick: () => { if (state !== S.WARN) return; job.approved = job.need; startConvert(); } }, 'Continue'),
        h('button', { class: 'link', type: 'button', onclick: () => { setState(S.SETTINGS); focus('.go'); } }, 'Stop'));
      return;
    }

    panel.append(h('p', { class: 'label' }, 'Convert to'));
    const list = h('div', { class: 'list', role: 'group', 'aria-label': 'Output format' });
    for (const f of FORMATS) {
      if (f.needs && !support[f.needs]) continue;       // this browser has no encoder for it
      const sel = state === S.SETTINGS && job.format === f;
      list.append(h('button', { class: 'opt' + (sel ? ' sel' : ''), type: 'button', 'aria-pressed': String(sel),
                                'aria-expanded': String(sel), 'data-format': f.id, onclick: () => selectFormat(f) }, f.label));
      if (sel) list.append(settingsBlock(f));
    }
    panel.append(list);
  }

  function rateChoices(f) {
    const src = job.info.sampleRate;
    const set = new Set(f.rates);
    if (src && !f.fixedRates) set.add(src);
    const items = [...set].sort((a, b) => a - b).map(r => ({ id: r === src ? 0 : r, label: khz(r) }));
    if (!src && !f.fixedRates) items.unshift({ id: 0, label: 'Original' });
    return items;
  }

  function chipRow(name, items, current, onPick) {
    const row = h('div', { class: 'chips', role: 'radiogroup', 'aria-label': name });
    for (const it of items) {
      const on = current === it.id;
      row.append(h('button', { class: 'chip' + (on ? ' sel' : ''), type: 'button', role: 'radio', 'aria-checked': String(on),
        'data-value': String(it.id), onclick: () => { onPick(it.id); render(); focus(`.chips[aria-label="${name}"] .chip.sel`); } }, it.label));
    }
    return row;
  }

  function settingsBlock(f) {
    const box = h('div', { class: 'settings' });
    if (f.sub) box.append(h('p', { class: 'sub keep' }, f.sub));
    for (const r of f.rows) {
      box.append(h('p', { class: 'sub' }, r.name), chipRow(r.name, r.options, job.opts[r.key], v => { job.opts[r.key] = v; }));
    }
    const rc = rateChoices(f);
    if (rc.length === 1) box.append(h('p', { class: 'sub' }, 'Sample rate'), h('p', { class: 'sub keep' }, rc[0].label));
    else box.append(h('p', { class: 'sub' }, 'Sample rate'), chipRow('Sample rate', rc, job.rate, v => { job.rate = v; }));
    const notes = [];
    if (['mp3', 'aac', 'opus'].includes(f.id) && (job.info.channels || 0) > 2) notes.push('Mixed down to stereo');
    if (job.info.lossy && f.lossy) notes.push('Quality will be lower');
    if (notes.length) box.append(h('p', { class: 'note' }, notes.join(' · ')));
    box.append(h('button', { class: 'go', type: 'button', onclick: startConvert }, 'Convert'));
    return box;
  }

  function focus(sel) { const el = panel.querySelector(sel); if (el) el.focus({ preventScroll: true }); }

  /* ---------- status line ---------- */
  let statusTimer = 0;
  function showStatus(text, ok) {
    clearTimeout(statusTimer);
    statusEl.replaceChildren(h('p', { class: 'msg' + (ok ? ' ok' : '') }, text));
    // download fallback: a browser can block a download that starts long after the tap
    if (ok && lastResult) {
      statusEl.append(h('p', { class: 'hint' }, 'No download? Push Save.'));
      const row = h('div', { class: 'actions' },
        h('button', { class: 'go save', type: 'button', onclick: () => { if (lastResult) saveBlob(lastResult.blob, lastResult.name); } }, 'Save'));
      if (canShareResult()) row.append(h('button', { class: 'link', type: 'button', onclick: shareResult }, 'Share'));
      statusEl.append(row);
    }
    statusEl.hidden = false;
    statusTimer = setTimeout(() => { hideStatus(); lastResult = null; }, ok ? 60000 : 5000);   // then the result is released
  }
  function hideStatus() { clearTimeout(statusTimer); statusEl.hidden = true; statusEl.replaceChildren(); }

  /* ---------- file selection ---------- */
  addBtn.addEventListener('click', () => { if (state !== S.CONVERTING) fileIn.click(); });
  fileIn.addEventListener('change', () => { const f = fileIn.files && fileIn.files[0]; fileIn.value = ''; onFile(f); });

  // A file chosen while an earlier probe runs wins; a probe that ends during a conversion is dropped.
  let probeSeq = 0;
  async function onFile(file) {
    if (!file || state === S.CONVERTING) return;
    const pid = ++probeSeq;
    const stale = () => pid !== probeSeq || state === S.CONVERTING;
    lastResult = null;
    hideStatus();
    if (!file.size) return fail('empty');
    try { await ready; } catch (e) { if (!stale()) fail('internal'); return; }
    if (stale()) return;
    let pr;
    try { pr = await probeFile(file); }
    catch (e) { if (!stale()) fail(e && MSG[e.code] ? e.code : e instanceof RangeError ? 'memory' : 'format'); return; }
    if (stale()) return;
    job = { file, info: pr.info, tags: pr.tags, format: null, opts: {}, rate: 0, approved: 0 };
    setState(S.PICK);
    focus('.opt');
  }

  let selectedAt = 0;
  function selectFormat(f) {
    if (state === S.SETTINGS && job.format === f) {
      if (performance.now() - selectedAt < 450) return;   // a double tap selects; it does not also convert
      return startConvert();
    }
    selectedAt = performance.now();
    job.format = f;
    job.opts = {};
    for (const r of f.rows) job.opts[r.key] = r.def(job.info);
    job.rate = f.defRate ? f.defRate(job.info) : 0;
    setState(S.SETTINGS);
    focus('.opt.sel');
    revealSettings();
  }
  // Small screens: scroll the panel so the settings and Convert are visible (the selected format stays in view)
  function revealSettings() {
    const sel = panel.querySelector('.opt.sel'), go = panel.querySelector('.settings .go');
    if (!sel || !go || panel.scrollHeight <= panel.clientHeight) return;
    const pr = panel.getBoundingClientRect(), top = sel.getBoundingClientRect().top - pr.top + panel.scrollTop;
    const bottom = go.getBoundingClientRect().bottom - pr.top + panel.scrollTop + 8;
    panel.scrollTop = Math.min(top, Math.max(panel.scrollTop, bottom - panel.clientHeight));
  }

  /* ---------- conversion ---------- */
  // Progress weights: read 5%, decode 20%, encode 70%, build Blob 5%.
  // Formats with no decode step (PCM) give the decode share to encode.
  let encodeBase = 0.05;
  function setProgress(p) { shown = Math.max(shown, Math.min(1, p)); paintProgress(); }
  function paintProgress() {
    if (!barFill) return;
    const pct = Math.floor(shown * 100);
    barFill.style.transform = `scaleX(${shown})`;
    pctEl.textContent = pct + '%';
    barEl.setAttribute('aria-valuenow', String(pct));
  }
  function startFake(from, to, seconds) {
    stopFake();
    const t0 = performance.now();
    fakeTimer = setInterval(() => {
      const k = 1 - Math.exp(-(performance.now() - t0) / 1000 / seconds);
      setProgress(from + (to - from) * k);
    }, 100);
  }
  function stopFake() { clearInterval(fakeTimer); fakeTimer = 0; }

  async function readFile(file, onP, isCancelled) {
    const size = file.size;
    if (file.stream && size > 0) {
      const out = new Uint8Array(size);
      const r = file.stream().getReader();
      let off = 0;
      for (;;) {
        const { done, value } = await r.read();
        if (done) break;
        if (isCancelled()) { r.cancel(); throw new Error('cancel'); }
        if (off + value.length > size) throw new Error('size');
        out.set(value, off); off += value.length;
        onP(off / size);
      }
      return off === size ? out.buffer : out.buffer.slice(0, off);
    }
    const b = await file.arrayBuffer();
    onP(1);
    return b;
  }

  // Memory estimate (bytes) for a job: input held in memory, decoded audio, output parts plus the Blob.
  // Own containers in a worker stream from the file: no input or decoded copy.
  const MEM_LIMIT = 600 * 1048576;
  function streams(format) { return job.info.own && workerOK && workerStream && (!format.needs || workerWC); }
  function estimateMemory(format, opts, rate) {
    const i = job.info, size = job.file.size;
    const chIn = i.channels || 2, rateIn = i.sampleRate || 48000;
    const dur = i.duration || (i.frames && i.sampleRate ? i.frames / i.sampleRate : null);
    let input = 0, decoded = 0;
    if (!i.own) { input = size; decoded = dur ? dur * rateIn * chIn * 4 * 2 : size * 24; }   // AudioBuffer + copy for the worker
    else if (!streams(format)) { input = size; if (i.container === 'flac') decoded = (dur || size / 2 / rateIn / chIn) * rateIn * chIn * 4; }
    const d = dur || (i.own ? size / (chIn * ((i.bits || 16) / 8)) / rateIn : size * 8 / 128000);
    const outRate = rate || rateIn, chOut = format.lossy && format.id !== 'au' ? Math.min(2, chIn) : chIn;
    let out;
    if (opts.bitrate) out = d * opts.bitrate * 125;
    else if (format.id === 'au') out = d * outRate * chOut;
    else {
      const bytes = opts.depth === '32f' ? 4 : opts.depth === '24' ? 3 : 2;
      out = d * outRate * chOut * bytes * (format.id === 'flac' ? 0.7 : 1);
    }
    return input + decoded + 2 * out;
  }
  function mb(n) { return n >= 1073741824 ? (n / 1073741824).toFixed(1) + ' GB' : Math.round(n / 1048576) + ' MB'; }

  async function startConvert() {
    const { file, info, format, opts, rate } = job;
    if (state === S.CONVERTING) return;
    const need = estimateMemory(format, opts, rate);
    if (need > MEM_LIMIT && need > job.approved) { job.need = need; setState(S.WARN); focus('.go'); return; }
    const id = ++jobId;
    shown = 0;
    const stream = info.own;                         // the worker streams it; the main-thread path reads it whole
    encodeBase = streams(format) ? 0 : 0.25;
    setState(S.CONVERTING);
    lockOn();
    const msg = { type: 'start', target: format.id, opts: Object.assign({ gpu: gpuMode }, opts), rate: rate || 0, tags: job.tags || {} };
    const transfer = [];
    if (stream) msg.file = file;
    else {
      let buf;
      try {
        buf = await readFile(file, p => { if (id === jobId) setProgress(p * 0.05); }, () => id !== jobId);
      } catch (e) {
        if (id !== jobId) return;
        return fail(e instanceof RangeError ? 'memory' : 'read');
      }
      if (id !== jobId) return;
      try { msg.tags = window.NeoCore.readTags(buf); } catch (e) { msg.tags = {}; }
      const est = info.duration ? Math.max(1, info.duration / 40) : 3; // rough decode time in seconds
      startFake(0.05, 0.25, est);
      let ab;
      try { ab = await decodeNative(buf, info.sampleRate || 48000); }
      catch (e) { if (id !== jobId) return; stopFake(); return fail(e instanceof RangeError ? 'memory' : info.container === 'unknown' ? 'format' : 'decode'); }
      if (id !== jobId) return;                      // cancelled: the timer now belongs to a newer job
      stopFake();
      buf = null;
      if (!ab.length) return fail('empty');
      const channels = [];
      try { for (let c = 0; c < ab.numberOfChannels; c++) channels.push(ab.getChannelData(c).slice()); }
      catch (e) { return fail('memory'); }
      job.info.sampleRate = job.info.sampleRate || ab.sampleRate;
      setProgress(0.25);
      msg.pcm = { channels, sampleRate: ab.sampleRate };
      transfer.push(...channels.map(c => c.buffer));
    }

    runner = createRunner(m => {
      if (id !== jobId || !m) return;
      if (m.type === 'progress') {
        if (m.stage === 'decode') setProgress(0.05 + 0.2 * m.value);
        else setProgress(encodeBase + (0.95 - encodeBase) * m.value);
      }
      else if (m.type === 'done') { stopRunner(); finish(id, m, file.name, format.suffix(opts)); }
      else if (m.type === 'error') { stopRunner(); fail(m.code); }
    }, !!(format.needs));
    runner.post(msg, transfer);
  }

  function stopRunner() { if (runner) { runner.stop(); runner = null; } }

  function finish(id, msg, srcName, suffix) {
    let blob;
    try { blob = new Blob(msg.parts, { type: msg.mime }); } catch (e) { return fail('memory'); }
    setProgress(1);
    lockOff();
    const name = outName(srcName, msg.ext, suffix);
    lastResult = { blob, name, mime: msg.mime };
    setTimeout(() => {
      if (id !== jobId) return;
      saveBlob(blob, name);
      setState(S.IDLE);
      showStatus('Saved — ' + name + (msg.gpu ? ' · GPU' : ''), true);
      const sv = statusEl.querySelector('.save'); if (sv) sv.focus({ preventScroll: true });
    }, 180);
  }

  function cancel() { jobId++; stopFake(); stopRunner(); lockOff(); lastResult = null; setState(S.SETTINGS); focus('.go'); }

  function fail(code) {
    jobId++; stopFake(); stopRunner(); lockOff();
    setState(S.IDLE);
    lastResult = null;
    showStatus(MSG[code] || MSG.internal, false);
    addBtn.focus({ preventScroll: true });
  }

  // Same extension as the source: add the setting (song.wav -> song-24bit.wav) so the original is not confused.
  function outName(src, ext, suffix) {
    const m = src.match(/\.([^./\\]*)$/), srcExt = m ? m[1].toLowerCase() : '';
    let base = src.replace(/\.[^./\\]*$/, '').replace(/[\\/:*?"<>|\x00-\x1f]/g, '_').trim() || 'audio';
    const same = srcExt === ext || (ext === 'wav' && srcExt === 'wave') || (ext === 'aiff' && (srcExt === 'aif' || srcExt === 'aifc')) || (ext === 'au' && srcExt === 'snd');
    if (same) base += '-' + (suffix || 'converted');
    return base + '.' + ext;
  }

  /* ---------- delivery ---------- */
  function saveBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: name, rel: 'noopener', style: 'display:none' });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);     // iOS can ask "Download?" first
  }
  function resultFile() { return new File([lastResult.blob], lastResult.name, { type: lastResult.mime }); }
  function canShareResult() {
    try { return !!(navigator.canShare && navigator.canShare({ files: [resultFile()] })); } catch (e) { return false; }
  }
  async function shareResult() { if (!lastResult) return; try { await navigator.share({ files: [resultFile()] }); } catch (e) { /* user closed */ } }

  /* ---------- wake lock ---------- */
  let wakeLock = null;
  async function lockOn() {
    if (!('wakeLock' in navigator) || wakeLock) return;
    try {
      const l = await navigator.wakeLock.request('screen');
      if (state !== S.CONVERTING || wakeLock) { l.release().catch(() => {}); return; }   // the job ended while waiting
      wakeLock = l;
    } catch (e) { wakeLock = null; }
  }
  function lockOff() { try { if (wakeLock) wakeLock.release(); } catch (e) { /* ignore */ } wakeLock = null; }
  document.addEventListener('visibilitychange', () => {
    if (state !== S.CONVERTING) return;
    if (document.visibilityState === 'visible') {
      wakeLock = null; lockOn();
      if (noteEl) noteEl.textContent = 'Keep this page open';
    }
  });

  /* ---------- keyboard ---------- */
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (state !== S.IDLE) { e.preventDefault(); back(); } return; }
    if (!/^Arrow(Up|Down|Left|Right)$/.test(e.key) || panel.hidden) return;
    const items = [...panel.querySelectorAll('button')];
    if (!items.length) return;
    e.preventDefault();
    const i = items.indexOf(document.activeElement);
    const dir = e.key === 'ArrowDown' || e.key === 'ArrowRight' ? 1 : -1;
    items[i < 0 ? 0 : (i + dir + items.length) % items.length].focus();
  });

  /* ---------- drag and drop (desktop) ---------- */
  let dragDepth = 0;
  const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
  function dragTint(on) { gridColor = on ? `rgba(${ACC_RGB},0.8)` : 'rgba(255,255,255,0.35)'; drawGrid(); }
  addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); if (++dragDepth === 1) dragTint(true); });
  addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = state === S.CONVERTING ? 'none' : 'copy'; });
  addEventListener('dragleave', e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; dragTint(false); } });
  addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth = 0; dragTint(false);
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) onFile(f);
  });

  // MP3 analysis on the GPU: 'auto' (hardware GPU only), 'off', or 'force' (also a software GPU; for tests)
  let gpuMode = 'auto';
  window.neoconvert = { get gpu() { return gpuMode; }, set gpu(v) { gpuMode = ['auto', 'off', 'force'].includes(v) ? v : 'auto'; }, version: VERSION, get worker() { return workerOK; }, get workerWebCodecs() { return workerWC; }, support, get info() { return job.info; } };
})();
</script>
</body>
</html>
